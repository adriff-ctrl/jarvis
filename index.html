<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061219">
<title>Jarvis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --fondo:#E7F1F3; --halo:rgba(10,138,154,.18); --rejilla:rgba(10,110,125,.07);
  --superficie:rgba(255,255,255,.72); --linea:rgba(10,110,125,.3);
  --texto:#0B2E36; --tenue:#4D6E76; --acento:#0A8A9A; --alerta:#C43D3D; --sobre-acento:#031A1E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --fondo:#061219; --halo:rgba(92,225,230,.16); --rejilla:rgba(92,225,230,.05);
    --superficie:rgba(12,38,50,.6); --linea:rgba(110,231,240,.28);
    --texto:#DDF6F8; --tenue:#7FA9B3; --acento:#5CE1E6; --alerta:#FF6B6B; --sobre-acento:#031A1E;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fondo:#061219; --halo:rgba(92,225,230,.16); --rejilla:rgba(92,225,230,.05);
  --superficie:rgba(12,38,50,.6); --linea:rgba(110,231,240,.28);
  --texto:#DDF6F8; --tenue:#7FA9B3; --acento:#5CE1E6; --alerta:#FF6B6B; --sobre-acento:#031A1E;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;color:var(--texto);
  font:400 1.0625rem/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(ellipse 80% 45% at 50% 22%,var(--halo),transparent 70%),
    repeating-linear-gradient(0deg,var(--rejilla) 0 1px,transparent 1px 32px),
    repeating-linear-gradient(90deg,var(--rejilla) 0 1px,transparent 1px 32px),
    var(--fondo);
}
.marco{display:flex;flex-direction:column;height:100%;width:100%;max-width:40rem;margin:0 auto;padding:0 1rem}

header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.875rem 0 0}
h1{font:600 1.5rem/1 "Chakra Petch","Segoe UI",system-ui,sans-serif;letter-spacing:.12em;margin:0;color:var(--acento)}
.lado{display:flex;align-items:center;gap:.75rem}
#hora{font:500 1rem/1 "Chakra Petch","Segoe UI",system-ui,sans-serif;color:var(--tenue);font-variant-numeric:tabular-nums}

.icono{
  flex:none;width:2.75rem;height:2.75rem;display:grid;place-items:center;cursor:pointer;
  background:var(--superficie);border:1px solid var(--linea);color:var(--texto);border-radius:.5rem;
}
.icono svg{width:1.25rem;height:1.25rem}
.enviar{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}

#nucleo{
  position:relative;display:block;width:100%;height:clamp(13rem,38vh,22rem);
  border:0;padding:0;background:none;cursor:pointer;touch-action:none;border-radius:1rem;
  -webkit-tap-highlight-color:transparent;
}
#lienzo{position:absolute;inset:0;width:100%;height:100%;display:block}
#estado{
  margin:0 0 .75rem;text-align:center;min-height:1.5em;
  font:500 1rem/1.5 "Chakra Petch","Segoe UI",system-ui,sans-serif;letter-spacing:.06em;color:var(--acento);
}
body[data-estado="error"] #estado{color:var(--alerta)}

.panel{
  --c:var(--acento);
  background:
    linear-gradient(var(--c),var(--c)) top left/16px 2px no-repeat,
    linear-gradient(var(--c),var(--c)) top left/2px 16px no-repeat,
    linear-gradient(var(--c),var(--c)) top right/16px 2px no-repeat,
    linear-gradient(var(--c),var(--c)) top right/2px 16px no-repeat,
    linear-gradient(var(--c),var(--c)) bottom left/16px 2px no-repeat,
    linear-gradient(var(--c),var(--c)) bottom left/2px 16px no-repeat,
    linear-gradient(var(--c),var(--c)) bottom right/16px 2px no-repeat,
    linear-gradient(var(--c),var(--c)) bottom right/2px 16px no-repeat,
    var(--superficie);
  border:1px solid var(--linea);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
#charla{
  flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.875rem;
  padding:1rem;
}
.msg{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.yo{align-self:flex-end;color:var(--tenue);text-align:right}
.msg.jarvis{align-self:flex-start;border-left:2px solid var(--acento);padding-left:.75rem}
.msg.aviso{align-self:center;max-width:100%;color:var(--alerta);font-size:.9375rem;text-align:center}
.vacio{margin:auto 0;color:var(--tenue);text-align:center}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#formulario{display:flex;gap:.5rem;padding:.75rem 0 1rem}
#texto{
  flex:1;min-width:0;font:inherit;color:var(--texto);background:var(--superficie);
  border:1px solid var(--linea);border-radius:.5rem;padding:.625rem .875rem;
}
#texto::placeholder{color:var(--tenue)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acento);outline-offset:3px}

dialog{
  width:min(26rem,calc(100% - 2rem));border:1px solid var(--linea);border-radius:.75rem;
  background:var(--fondo);color:var(--texto);padding:1.25rem;
}
dialog::backdrop{background:rgba(2,8,12,.7)}
dialog h2{font:600 1.25rem/1.2 "Chakra Petch","Segoe UI",system-ui,sans-serif;color:var(--acento);margin:0 0 .5rem}
label{display:block;font-weight:700;margin:.875rem 0 .25rem}
dialog input{
  width:100%;font:inherit;color:var(--texto);background:var(--superficie);
  border:1px solid var(--linea);border-radius:.5rem;padding:.5rem .75rem;
}
.ayuda{color:var(--tenue);font-size:.875rem;margin:.25rem 0 0}
dialog{max-height:calc(100% - 2rem);overflow-y:auto}
dialog select{
  width:100%;font:inherit;color:var(--texto);background:var(--superficie);
  border:1px solid var(--linea);border-radius:.5rem;padding:.5rem .75rem;
}
dialog input[type="range"]{padding:0;border:0;background:none;accent-color:var(--acento)}
fieldset{border:1px solid var(--linea);border-radius:.5rem;margin:1.25rem 0 0;padding:.25rem .875rem .875rem}
legend{font:600 1rem/1 "Chakra Petch","Segoe UI",system-ui,sans-serif;color:var(--acento);padding:0 .375rem}
.valor{color:var(--tenue);font-weight:400}
#probarVoz{margin-top:1rem}
.botones{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;margin-top:1.25rem}
.botones span{display:flex;gap:.5rem}
.boton{font:inherit;font-weight:700;padding:.5rem 1rem;border-radius:.5rem;border:1px solid var(--linea);background:none;color:var(--texto);cursor:pointer}
.boton.principal{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}
</style>
</head>
<body data-estado="reposo">
<div class="marco">
  <header>
    <h1>Jarvis</h1>
    <div class="lado">
      <span id="hora" aria-hidden="true"></span>
      <button class="icono" id="abrirAjustes" type="button" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>
  </header>

  <button id="nucleo" type="button" aria-label="Hablar con Jarvis">
    <canvas id="lienzo" aria-hidden="true"></canvas>
  </button>
  <p id="estado" aria-live="polite">Toca para hablar</p>

  <main id="charla" class="panel"></main>

  <form id="formulario">
    <input id="texto" autocomplete="off" enterkeyhint="send" placeholder="Escribe a Jarvis" aria-label="Mensaje para Jarvis">
    <button class="icono enviar" type="submit" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2-6-8-2z"/></svg>
    </button>
  </form>
</div>

<dialog id="ajustes">
  <form method="dialog">
    <h2>Conectar con Jarvis</h2>
    <label for="cfgUrl">Dirección de la aplicación web</label>
    <input id="cfgUrl" type="url" required placeholder="https://script.google.com/macros/s/…/exec">
    <p class="ayuda">La que te da Apps Script al implementar, terminada en /exec.</p>
    <label for="cfgClave">Clave de Jarvis</label>
    <input id="cfgClave" type="password" required autocomplete="off">
    <p class="ayuda">Se guarda solo en este móvil.</p>
    <fieldset>
      <legend>Voz</legend>
      <label for="cfgVoz">Voz de Jarvis</label>
      <select id="cfgVoz"></select>
      <p class="ayuda">Son las voces en español instaladas en el móvil.</p>
      <label for="cfgTono">Tono <span class="valor" id="vTono"></span></label>
      <input id="cfgTono" type="range" min="0.5" max="1.5" step="0.05">
      <label for="cfgVel">Velocidad <span class="valor" id="vVel"></span></label>
      <input id="cfgVel" type="range" min="0.7" max="1.4" step="0.05">
      <button class="boton" id="probarVoz" type="button">Probar voz</button>
    </fieldset>
    <div class="botones">
      <button class="boton" id="borrar" type="button">Borrar conversación</button>
      <span>
        <button class="boton" value="cancelar" formnovalidate>Cancelar</button>
        <button class="boton principal" value="guardar">Guardar</button>
      </span>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const MAX_HISTORIAL = 20;
const REDUCIDO = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= Núcleo holográfico 3D ================= */
const holo = (() => {
  const nulo = { estado(){}, golpe(){}, girar(){} };
  if(!window.THREE) return nulo;
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({ canvas:$('#lienzo'), alpha:true, antialias:true }); }
  catch(e){ return nulo; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

  const escena = new THREE.Scene();
  const camara = new THREE.PerspectiveCamera(38, 1, .1, 50);
  camara.position.z = 4.4;
  const grupo = new THREE.Group();
  escena.add(grupo);

  const aditivo = { transparent:true, blending:THREE.AdditiveBlending, depthWrite:false };

  // Textura redonda y suave para partículas y brillo central
  function textura(interior, exterior){
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const r = g.createRadialGradient(32,32,0,32,32,32);
    r.addColorStop(0,'rgba(255,255,255,1)');
    r.addColorStop(interior,'rgba(255,255,255,.6)');
    r.addColorStop(exterior,'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  }

  // Casco de cristal (icosaedro) e interior (octaedro)
  const forma = new THREE.IcosahedronGeometry(1.15, 0);
  const casco = new THREE.LineSegments(new THREE.WireframeGeometry(forma), new THREE.LineBasicMaterial({ ...aditivo, opacity:.6 }));
  const interior = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.OctahedronGeometry(.55, 0)), new THREE.LineBasicMaterial({ ...aditivo, opacity:.85 }));
  grupo.add(casco, interior);

  // Partículas repartidas por las caras del cristal
  const v = forma.attributes.position.array;
  const caras = v.length / 9;
  const N = 1400;
  const base = new Float32Array(N*3), fase = new Float32Array(N);
  for(let i=0;i<N;i++){
    const f = Math.floor(Math.random()*caras)*9;
    let a = Math.random(), b = Math.random();
    if(a + b > 1){ a = 1 - a; b = 1 - b; }
    const c = 1 - a - b, prof = .78 + Math.random()*.32;
    for(let k=0;k<3;k++) base[i*3+k] = (v[f+k]*a + v[f+3+k]*b + v[f+6+k]*c) * prof;
    fase[i] = Math.random()*Math.PI*2;
  }
  const geoPuntos = new THREE.BufferGeometry();
  geoPuntos.setAttribute('position', new THREE.BufferAttribute(base.slice(), 3));
  const puntos = new THREE.Points(geoPuntos, new THREE.PointsMaterial({ ...aditivo, size:.05, map:textura(.25,1), opacity:.9 }));
  grupo.add(puntos);

  // Brillo central
  const brilloMat = new THREE.SpriteMaterial({ ...aditivo, map:textura(.15,.7) });
  const brillo = new THREE.Sprite(brilloMat);
  escena.add(brillo);

  // Colores tomados del tema
  const cAcento = new THREE.Color(), cAlerta = new THREE.Color(), cMezcla = new THREE.Color();
  function leerColores(){
    const cs = getComputedStyle(document.documentElement);
    cAcento.set(cs.getPropertyValue('--acento').trim() || '#5CE1E6');
    cAlerta.set(cs.getPropertyValue('--alerta').trim() || '#FF6B6B');
  }
  leerColores();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', leerColores);

  // Comportamiento por estado
  const MODOS = {
    reposo:     { giro:.18, onda:.02, luz:.7, alerta:0 },
    escuchando: { giro:.35, onda:.09, luz:1,  alerta:0 },
    pensando:   { giro:1.7, onda:.05, luz:.9, alerta:0 },
    hablando:   { giro:.45, onda:.03, luz:1,  alerta:0 },
    error:      { giro:.1,  onda:.02, luz:.8, alerta:1 }
  };
  const meta = { ...MODOS.reposo }, act = { ...MODOS.reposo };
  let pulso = 0, velY = 0, velX = 0, ritmo = null;

  function ajustar(){
    const r = $('#nucleo').getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    camara.aspect = r.width / Math.max(r.height, 1);
    camara.updateProjectionMatrix();
  }
  new ResizeObserver(ajustar).observe($('#nucleo'));
  ajustar();

  const lento = REDUCIDO ? .3 : 1;
  let antes = performance.now();
  function cuadro(ahora){
    const dt = Math.min((ahora - antes)/1000, .05); antes = ahora;
    const t = ahora/1000;
    for(const k in meta) act[k] += (meta[k] - act[k]) * Math.min(dt*4, 1);
    pulso *= Math.pow(.03, dt);

    const onda = (act.onda + pulso*.1) * lento;
    const p = geoPuntos.attributes.position.array;
    for(let i=0;i<N;i++){
      const s = 1 + onda*Math.sin(t*3 + fase[i]) + pulso*.07;
      p[i*3] = base[i*3]*s; p[i*3+1] = base[i*3+1]*s; p[i*3+2] = base[i*3+2]*s;
    }
    geoPuntos.attributes.position.needsUpdate = true;

    const giro = act.giro * lento;
    grupo.rotation.y += giro*dt + velY;
    grupo.rotation.x += giro*.35*dt + velX;
    velY *= Math.pow(.04, dt); velX *= Math.pow(.04, dt);
    interior.rotation.y -= giro*2.2*dt;
    interior.rotation.z += giro*1.3*dt;
    const escala = 1 + pulso*.06;
    casco.scale.setScalar(escala);

    cMezcla.copy(cAcento).lerp(cAlerta, act.alerta);
    casco.material.color.copy(cMezcla);
    interior.material.color.copy(cMezcla);
    puntos.material.color.copy(cMezcla);
    brilloMat.color.copy(cMezcla);
    casco.material.opacity = .3 + .4*act.luz;
    brilloMat.opacity = .35 + .45*act.luz + pulso*.3;
    brillo.scale.setScalar((.9 + pulso*.6 + Math.sin(t*2)*.04*lento) * (.8 + .3*act.luz));

    renderer.render(escena, camara);
    requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);

  return {
    estado(nombre){
      Object.assign(meta, MODOS[nombre] || MODOS.reposo);
      clearInterval(ritmo);
      if(nombre === 'hablando' && !REDUCIDO) ritmo = setInterval(() => { pulso = Math.max(pulso, .25 + Math.random()*.45); }, 160);
    },
    golpe(fuerza){ pulso = Math.max(pulso, fuerza); },
    girar(dx, dy){ grupo.rotation.y += dx; grupo.rotation.x += dy; velY = dx*.6; velX = dy*.6; }
  };
})();

/* ================= Conversación ================= */
function leer(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function guardar(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let cfg = leer('jarvis-cfg') || { url:'', clave:'' };
let historial = leer('jarvis-historial') || [];
let ocupado = false;

const TEXTOS = { reposo:'Toca para hablar', escuchando:'Te escucho', pensando:'Procesando', hablando:'Hablando · toca para callar', error:'Sin respuesta' };
function estado(e){
  document.body.dataset.estado = e;
  $('#estado').textContent = TEXTOS[e] || '';
  holo.estado(e);
}

function pintar(){
  const c = $('#charla');
  c.textContent = '';
  if(!historial.length){
    const p = document.createElement('p');
    p.className = 'vacio';
    p.textContent = 'Toca el cristal para hablar o escribe abajo. Puedes girarlo con el dedo.';
    c.append(p);
    return;
  }
  historial.forEach(m => anadirBurbuja(m.role === 'user' ? 'yo' : 'jarvis', m.content, false));
}

function anadirBurbuja(tipo, texto, animar){
  const c = $('#charla');
  const vacio = c.querySelector('.vacio');
  if(vacio) vacio.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + tipo;
  c.append(d);
  if(!animar || REDUCIDO){
    d.textContent = texto;
  }else{
    // Texto completo para lectores de pantalla; el visible aparece poco a poco
    const lector = document.createElement('span'); lector.className = 'oculto'; lector.textContent = texto;
    const visible = document.createElement('span'); visible.setAttribute('aria-hidden','true');
    d.append(lector, visible);
    let i = 0;
    const paso = Math.max(2, Math.ceil(texto.length / 120));
    const id = setInterval(() => {
      i += paso;
      visible.textContent = texto.slice(0, i);
      c.scrollTop = c.scrollHeight;
      if(i >= texto.length) clearInterval(id);
    }, 18);
  }
  c.scrollTop = c.scrollHeight;
}

async function enviar(texto, porVoz){
  texto = (texto || '').trim();
  if(!texto || ocupado) return;
  if(!cfg.url || !cfg.clave){ abrirAjustes(); return; }
  ocupado = true;
  if(window.speechSynthesis) speechSynthesis.cancel();

  historial.push({ role:'user', content:texto });
  anadirBurbuja('yo', texto, false);
  estado('pensando');

  try{
    const r = await fetch(cfg.url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ token:cfg.clave, historial:historial.slice(-MAX_HISTORIAL) })
    });
    if(!r.ok) throw new Error('el servidor respondió con el código ' + r.status + '.');
    const d = await r.json();
    if(d.error) throw new Error(d.error);

    historial.push({ role:'assistant', content:d.respuesta });
    historial = historial.slice(-MAX_HISTORIAL * 2);
    guardar('jarvis-historial', historial);
    holo.golpe(1);
    anadirBurbuja('jarvis', d.respuesta, true);
    if(porVoz) hablar(d.respuesta); else estado('reposo');
  }catch(err){
    historial.pop();
    const motivo = err instanceof TypeError ? 'no hay conexión con el servidor.' : err.message;
    anadirBurbuja('aviso', 'Jarvis no ha podido contestar: ' + motivo + ' Revisa la dirección y la clave en Ajustes.', false);
    estado('error');
  }finally{
    ocupado = false;
  }
}

/* Voz de salida */
let vocesEs = [];
function cargarVoces(){
  vocesEs = speechSynthesis.getVoices().filter(v => v.lang.replace('_','-').toLowerCase().startsWith('es'));
  // Primero las de España
  vocesEs.sort((a, b) => (b.lang.replace('_','-') === 'es-ES') - (a.lang.replace('_','-') === 'es-ES'));
  const sel = $('#cfgVoz');
  sel.textContent = '';
  const auto = document.createElement('option');
  auto.value = ''; auto.textContent = 'Automática (la del sistema)';
  sel.append(auto);
  vocesEs.forEach(v => {
    const o = document.createElement('option');
    o.value = v.name; o.textContent = v.name + ' (' + v.lang + ')';
    sel.append(o);
  });
  sel.value = vocesEs.some(v => v.name === cfg.voz) ? cfg.voz : '';
}
if(window.speechSynthesis){ cargarVoces(); speechSynthesis.onvoiceschanged = cargarVoces; }

function locucion(texto, voz, tono, velocidad){
  const u = new SpeechSynthesisUtterance(texto.replace(/[*_#`>]/g, ''));
  u.lang = 'es-ES';
  const v = vocesEs.find(x => x.name === voz) || vocesEs[0];
  if(v){ u.voice = v; u.lang = v.lang; }
  u.pitch = tono;
  u.rate = velocidad;
  return u;
}

function hablar(texto){
  if(!window.speechSynthesis){ estado('reposo'); return; }
  const u = locucion(texto, cfg.voz, cfg.tono ?? .85, cfg.velocidad ?? 1);
  u.onstart = () => estado('hablando');
  u.onboundary = () => holo.golpe(.8);
  u.onend = u.onerror = () => estado('reposo');
  speechSynthesis.speak(u);
}

/* Voz de entrada */
const Reconocedor = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, escuchando = false;

function escuchar(){
  if(window.speechSynthesis && speechSynthesis.speaking){ speechSynthesis.cancel(); estado('reposo'); return; }
  if(ocupado) return;
  if(!Reconocedor){ anadirBurbuja('aviso', 'Este navegador no permite dictar. Usa Chrome o escribe tu mensaje.', false); return; }
  if(escuchando){ rec.stop(); return; }

  rec = new Reconocedor();
  rec.lang = 'es-ES';
  rec.interimResults = true;
  let dicho = '';
  rec.onstart = () => { escuchando = true; estado('escuchando'); };
  rec.onresult = e => {
    dicho = Array.from(e.results).map(r => r[0].transcript).join('');
    $('#texto').value = dicho;
    holo.golpe(.5);
  };
  rec.onerror = e => {
    if(e.error === 'not-allowed') anadirBurbuja('aviso', 'Jarvis no tiene permiso para usar el micrófono. Actívalo en los ajustes del sitio en Chrome.', false);
    else if(e.error !== 'no-speech' && e.error !== 'aborted') anadirBurbuja('aviso', 'No te he entendido (' + e.error + '). Prueba otra vez.', false);
  };
  rec.onend = () => {
    escuchando = false;
    if(dicho.trim()){ $('#texto').value = ''; enviar(dicho, true); }
    else if(!ocupado) estado('reposo');
  };
  rec.start();
}

/* Tocar y girar el cristal */
(() => {
  const n = $('#nucleo');
  let toque = null, arrastrado = false;
  n.addEventListener('pointerdown', e => {
    toque = { x:e.clientX, y:e.clientY, ux:e.clientX, uy:e.clientY };
    arrastrado = false;
    n.setPointerCapture(e.pointerId);
  });
  n.addEventListener('pointermove', e => {
    if(!toque) return;
    if(Math.hypot(e.clientX - toque.x, e.clientY - toque.y) > 8) arrastrado = true;
    if(arrastrado) holo.girar((e.clientX - toque.ux) * .01, (e.clientY - toque.uy) * .01);
    toque.ux = e.clientX; toque.uy = e.clientY;
  });
  const soltar = () => { toque = null; };
  n.addEventListener('pointerup', soltar);
  n.addEventListener('pointercancel', soltar);
  n.addEventListener('click', () => {
    if(arrastrado){ arrastrado = false; return; }
    holo.golpe(1);
    escuchar();
  });
})();

/* Ajustes */
function mostrarValores(){
  $('#vTono').textContent = Number($('#cfgTono').value).toFixed(2);
  $('#vVel').textContent = Number($('#cfgVel').value).toFixed(2);
}
function abrirAjustes(){
  $('#cfgUrl').value = cfg.url;
  $('#cfgClave').value = cfg.clave;
  if(window.speechSynthesis) cargarVoces();
  $('#cfgTono').value = cfg.tono ?? .85;
  $('#cfgVel').value = cfg.velocidad ?? 1;
  mostrarValores();
  $('#ajustes').showModal();
}
$('#cfgTono').addEventListener('input', mostrarValores);
$('#cfgVel').addEventListener('input', mostrarValores);
$('#probarVoz').addEventListener('click', () => {
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(locucion('Hola, Adrián. Todo listo cuando usted quiera.', $('#cfgVoz').value, Number($('#cfgTono').value), Number($('#cfgVel').value)));
});
$('#ajustes').addEventListener('close', () => {
  if($('#ajustes').returnValue === 'guardar'){
    cfg = {
      url:$('#cfgUrl').value.trim(), clave:$('#cfgClave').value.trim(),
      voz:$('#cfgVoz').value, tono:Number($('#cfgTono').value), velocidad:Number($('#cfgVel').value)
    };
    guardar('jarvis-cfg', cfg);
    estado('reposo');
  }
});
$('#borrar').addEventListener('click', () => {
  if(confirm('¿Borrar la conversación con Jarvis?')){
    historial = [];
    guardar('jarvis-historial', historial);
    pintar();
    $('#ajustes').close('cancelar');
  }
});
$('#abrirAjustes').addEventListener('click', abrirAjustes);
$('#formulario').addEventListener('submit', e => {
  e.preventDefault();
  const t = $('#texto').value;
  $('#texto').value = '';
  enviar(t, false);
});

/* Reloj */
function reloj(){ $('#hora').textContent = new Date().toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' }); }
reloj(); setInterval(reloj, 15000);

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

pintar();
estado('reposo');
if(!cfg.url || !cfg.clave) abrirAjustes();
</script>
